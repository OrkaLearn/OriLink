<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OriLink 元联 - Dashboard 仪表板</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: 'InstrumentSans', 'Noto Sans SC', 'Source Sans 3', sans-serif; }
    input[type="checkbox"] { width: 18px; height: 18px; }
    .nav-item.active { background: rgba(255, 255, 255, 0.2); }
    select option { color: black; background: white; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 md:p-8 pt-24 pb-24">
  
  <div class="bg-container">
    <img src="imgs/bridge.jpg" alt="Bridge background 桥背景">
    <div class="bg-overlay"></div>
  </div>

  <div class="fixed top-8 left-8 md:top-12 md:left-12 z-10">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 md:w-14 md:h-14 bg-gradient-to-br from-white/20 to-white/5 rounded-xl backdrop-blur-sm border border-white/20 flex items-center justify-center">
        <img src="imgs/logo.svg" alt="OriLink Logo OriLink 标志" class="w-8 h-8 md:w-10 md:h-10">
      </div>
      <div class="flex flex-col">
        <span class="logo-text text-2xl md:text-3xl font-bold tracking-tight">OriLink</span>
        <span class="text-white/70 text-sm md:text-base font-medium tracking-wide">元联</span>
      </div>
    </div>
  </div>

  <div class="fixed top-8 right-8 md:top-12 md:right-12 z-10">
    <button 
      id="logoutBtn" 
      class="px-4 py-2 rounded-lg bg-white/10 hover:bg-white/20 backdrop-blur-sm border border-white/20 text-white text-sm font-medium transition-all"
    >
      Logout 退出登录
    </button>
  </div>

  <div id="page-content" class="w-full max-w-md relative z-10">
    <div class="glass-panel rounded-2xl p-6 min-h-[400px] mb-24">
      <h2 id="page-title" class="text-white text-xl md:text-2xl font-bold mb-4" style="text-shadow: 0 1px 3px rgba(0,0,0,0.3);">Others' Invitations 他人邀请</h2>
      <div id="page-description" class="text-white/80 text-sm" style="text-shadow: 0 1px 3px rgba(0,0,0,0.3);">View invitations from other users 查看其他用户的邀请</div>
    </div>
  </div>

  <div class="fixed bottom-4 sm:bottom-6 left-1/2 -translate-x-1/2 z-50 max-w-[95vw]">
    <div class="glass-panel rounded-2xl p-2 sm:p-3 flex items-center justify-center gap-1 sm:gap-2">
      <button class="nav-item active px-2 sm:px-4 py-1.5 sm:py-2 rounded-xl text-white text-xs sm:text-sm font-medium transition-all flex flex-col items-center gap-0.5 sm:gap-1" data-page="invitations">
        <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        <span class="max-[360px]:hidden">Invitations 邀请</span>
      </button>
      <button class="nav-item px-2 sm:px-4 py-1.5 sm:py-2 rounded-xl text-white text-xs sm:text-sm font-medium transition-all flex flex-col items-center gap-0.5 sm:gap-1" data-page="joined">
        <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span class="max-[360px]:hidden">Joined 参与</span>
      </button>
      <button class="nav-item px-2 sm:px-4 py-1.5 sm:py-2 rounded-xl text-white text-xs sm:text-sm font-medium transition-all flex flex-col items-center gap-0.5 sm:gap-1" data-page="account">
        <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span class="max-[360px]:hidden">Account 账号</span>
      </button>
      <button class="nav-item px-2 sm:px-4 py-1.5 sm:py-2 rounded-xl text-white text-xs sm:text-sm font-medium transition-all flex flex-col items-center gap-0.5 sm:gap-1" data-page="about">
        <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="max-[360px]:hidden">About 关于</span>
      </button>
    </div>
  </div>

  <script src="dashboard.js" defer></script>

  <div id="inviteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
    <div id="modalBackdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
    <div class="relative glass-panel rounded-2xl p-6 max-w-sm w-full mx-4 max-h-[80vh] overflow-y-auto">
      <button id="closeModal" class="absolute top-3 right-3 text-white/60 hover:text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="reportModal" class="hidden fixed inset-0 z-[55] flex items-center justify-center">
    <div id="reportModalBackdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
    <div class="relative glass-panel rounded-2xl p-6 max-w-sm w-full mx-4">
      <h3 class="text-white font-bold text-lg mb-4">Report Invitation 举报邀请</h3>
      <p class="text-white/70 text-sm mb-3">Please explain why you are reporting this invitation. 请说明举报原因。</p>
      <textarea id="reportReason" rows="4" maxlength="500"
        class="w-full px-3 py-2 rounded-lg bg-white/10 border border-white/20 text-white text-sm focus:outline-none focus:border-white/40 resize-none"
        placeholder="Describe the issue... 描述问题..."></textarea>
      <p class="text-white/50 text-xs mt-1"><span id="reportReasonCount">0</span>/500</p>
      <p id="reportError" class="text-red-400 text-sm mt-2 hidden"></p>
      <div class="flex gap-3 mt-4">
        <button id="reportCancelBtn" class="flex-1 py-2 rounded-lg text-sm font-semibold border border-white/30 text-white/70 hover:bg-white/10 transition-colors">Cancel 取消</button>
        <button id="reportConfirmBtn" class="flex-1 py-2 rounded-lg bg-red-500/60 hover:bg-red-500/80 text-white text-sm font-semibold transition-all">Confirm Report 确认举报</button>
      </div>
    </div>
  </div>

  <div id="chatModal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
    <div id="chatModalBackdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
    <div class="relative glass-panel rounded-2xl p-4 w-full max-w-md mx-4 h-[70vh] flex flex-col">
      <div class="flex items-center justify-between mb-3">
        <h3 id="chatModalTitle" class="text-white font-semibold text-lg">Chat 聊天</h3>
        <button id="closeChatModal" onclick="closeChatModal()" class="text-white/60 hover:text-white">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="chatMessages" class="flex-1 overflow-y-auto mb-3 p-2 bg-white/5 rounded-lg">
        <p class="text-white/60 text-sm text-center py-4">Loading messages... 加载消息中...</p>
      </div>
      <div id="emojiPicker" class="hidden absolute bottom-20 left-4 right-4 glass-panel rounded-xl p-3 z-10">
        <div class="grid grid-cols-5 gap-2">
          <button class="emoji-btn text-2xl hover:bg-white/20 rounded-lg p-1 transition-colors" data-emoji="👌">👌</button>
          <button class="emoji-btn text-2xl hover:bg-white/20 rounded-lg p-1 transition-colors" data-emoji="😇">😇</button>
          <button class="emoji-btn text-2xl hover:bg-white/20 rounded-lg p-1 transition-colors" data-emoji="🙏">🙏</button>
          <button class="emoji-btn text-2xl hover:bg-white/20 rounded-lg p-1 transition-colors" data-emoji="👍">👍</button>
          <button class="emoji-btn text-2xl hover:bg-white/20 rounded-lg p-1 transition-colors" data-emoji="🎉">🎉</button>
          <button class="emoji-btn text-2xl hover:bg-white/20 rounded-lg p-1 transition-colors" data-emoji="😁">😁</button>
          <button class="emoji-btn text-2xl hover:bg-white/20 rounded-lg p-1 transition-colors" data-emoji="✊">✊</button>
          <button class="emoji-btn text-2xl hover:bg-white/20 rounded-lg p-1 transition-colors" data-emoji="🤝">🤝</button>
          <button class="emoji-btn text-2xl hover:bg-white/20 rounded-lg p-1 transition-colors" data-emoji="🌹">🌹</button>
          <button class="emoji-btn text-2xl hover:bg-white/20 rounded-lg p-1 transition-colors" data-emoji="❤️">❤️</button>
        </div>
      </div>
      <div class="flex gap-2">
        <textarea id="chatInput" rows="1"
          class="flex-1 px-3 py-2 rounded-lg bg-white/10 border border-white/20 text-white text-sm focus:outline-none focus:border-white/40 resize-none"
          placeholder="Enter message... 输入消息..."></textarea>
        <button id="emojiToggleBtn"
          class="px-3 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-white text-lg transition-all"
          title="Emoji 表情">😀</button>
        <button id="sendChatBtn"
          class="px-4 py-2 rounded-lg bg-white/20 hover:bg-white/30 text-white text-sm font-medium transition-all">
          Send 发送
        </button>
      </div>
    </div>
  </div>
</body>
</html>
